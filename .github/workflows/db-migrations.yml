name: DB Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: production
        options:
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - "packages/adapters/db/**"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Validate secrets
        uses: ./.github/actions/validate-secrets
        with:
          required: "${{ secrets.NEON_API_KEY }},${{ secrets.NEON_PROJECT_ID }},${{ secrets.DATABASE_URL }}"

      - name: Install Neon CLI
        run: pnpm add -g @neondatabase/cli

      - name: Verify Neon CLI
        run: |
          if command -v neon >/dev/null 2>&1; then
            neon --version
          elif command -v neonctl >/dev/null 2>&1; then
            neonctl --version
          else
            echo "Neon CLI command not found after install"
            exit 1
          fi

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Applying Drizzle migrations to Neon database"
          pnpm -C packages/adapters/db db:migrate

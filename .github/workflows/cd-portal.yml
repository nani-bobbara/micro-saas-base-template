name: CD Portal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/portal/**"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  deploy-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Validate deployment secrets
        uses: ./.github/actions/validate-secrets
        with:
          required: "${{ secrets.VERCEL_TOKEN }},${{ secrets.VERCEL_ORG_ID }},${{ secrets.VERCEL_PROJECT_ID_PORTAL }},${{ secrets.NEON_DATABASE_URL }},${{ secrets.STRIPE_SECRET_KEY }}"

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Stripe key format check
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [[ "${STRIPE_SECRET_KEY}" != sk_* ]]; then
            echo "Invalid STRIPE_SECRET_KEY format"
            exit 1
          fi
          echo "Stripe secret format looks valid"

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTAL }}
        run: vercel pull --cwd apps/portal --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build portal artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTAL }}
        run: vercel build --cwd apps/portal --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy portal to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTAL }}
        run: vercel deploy --cwd apps/portal --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

name: validate-secrets
description: Validate required secrets are present and non-empty.
inputs:
  required:
    description: Comma-separated list of secret values to validate
    required: true
runs:
  using: composite
  steps:
    - name: Validate required secrets
      run: |
        IFS=',' read -ra ITEMS <<< "${{ inputs.required }}"
        missing=0

        for raw in "${ITEMS[@]}"; do
          item="$(echo "$raw" | xargs)"
          if [[ -z "$item" ]]; then
            missing=1
          fi
        done

        if [[ "$missing" -ne 0 ]]; then
          echo "One or more required secrets are missing or empty."
          exit 1
        fi

        echo "Required secrets are present."
      shell: bash
